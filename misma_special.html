<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Misma | 3.31</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --rose-gold: #e0ac9a;
            --soft-pink: #fdf2f8;
            --pearl: #ffffff;
            --text-deep: #5a4a42;
        }
        
        body, html {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at top, #fff5f7 0%, #fce7f3 100%);
            font-family: 'Georgia', serif;
            overflow: hidden; text-align: center;
        }

        .container {
            width: 85%; max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(224, 172, 154, 0.3);
            box-shadow: 0 15px 35px rgba(224, 172, 154, 0.2);
            position: relative; z-index: 10;
        }

        .letter-box {
            font-size: 3rem; font-weight: bold;
            color: var(--rose-gold);
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .meaning {
            font-size: 1.1rem; color: var(--text-deep);
            line-height: 1.6; margin-bottom: 25px;
            min-height: 80px; font-style: italic;
        }

        .btn {
            background: var(--rose-gold); color: white;
            border: none; padding: 12px 30px;
            border-radius: 25px; font-size: 0.9rem;
            letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(224, 172, 154, 0.4);
        }

        /* Floating Decoration */
        .heart {
            position: absolute; color: var(--rose-gold);
            opacity: 0.2; font-size: 2rem; z-index: 1;
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="heart" style="top: 10%; left: 10%;">🌸</div>
    <div class="heart" style="bottom: 15%; right: 10%;">✨</div>

    <div class="container">
        <div id="main-display">
            <div class="letter-box" id="current-letter">M</div>
            <div class="meaning" id="current-word">Magnetic presence.</div>
            <button class="btn" onclick="nextLetter()">TAP TO REVEAL</button>
        </div>
    </div>

    <script>
        const letters = ["M", "I", "S", "M", "A"];
        const meanings = [
            "Magnetic presence.",
            "Incredibly rare.",
            "Sophisticated focus.",
            "More than words.",
            "Always enough."
        ];
        let index = 0;

        function nextLetter() {
            index++;
            if (index < letters.length) {
                document.getElementById('current-letter').innerText = letters[index];
                document.getElementById('current-word').innerText = meanings[index];
                
                // Light spark on each tap
                confetti({
                  particleCount: 20, spread: 50,
                  origin: { y: 0.7 }, colors: ['#e0ac9a', '#fbcfe8']
                });
            } else {
                showFinal();
            }
        }

        function showFinal() {
            const display = document.getElementById('main-display');
            display.innerHTML = `
                <div class="letter-box" style="font-size: 2rem;">MISMA</div>
                <div class="meaning">
                    happy birthday.<br>
                    no drama, no cliches.<br>
                    just a reminder that <br>
                    you’re worth the effort. <br><br>
                    🎂✨🌷
                </div>
                <p style="font-size: 0.8rem; color: #aaa;">- talal</p>
            `;
            
            // Final grand explosion of hearts and sparkles
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) { return clearInterval(interval); }
              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
